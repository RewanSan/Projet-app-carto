<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte Rando</title>
<meta name="theme-color" content="#2f5d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif}
#map{position:absolute;inset:0}
#bar{position:absolute;z-index:1000;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#f6f4ee;border-top:2px solid #2f5d3a}
#bar button,#bar select{flex:1;min-width:0;min-height:44px;font:600 15px system-ui,sans-serif;border:1.5px solid #2f5d3a;border-radius:8px;background:#fff;color:#1d3a25}
#bar button:focus-visible,#bar select:focus-visible{outline:3px solid #e8a317}
#bar button.on{background:#b3361f;border-color:#b3361f;color:#fff}
#info{position:absolute;z-index:1000;top:calc(8px + env(safe-area-inset-top));left:8px;background:#f6f4ee;border:1.5px solid #2f5d3a;padding:6px 10px;border-radius:8px;font:600 15px system-ui,sans-serif;color:#1d3a25;display:none}
.leaflet-bottom{bottom:calc(62px + env(safe-area-inset-bottom))}
#panel{position:absolute;z-index:1000;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));background:#f6f4ee;border:1.5px solid #2f5d3a;border-radius:10px;padding:10px 10px 2px;font:600 14px system-ui,sans-serif;color:#1d3a25}
#panel[hidden]{display:none}
#panel .row{display:grid;grid-template-columns:1fr 52px;gap:4px 8px;align-items:center;margin-bottom:10px}
#panel label,#panel select{grid-column:1/-1}
#panel select{min-height:40px;font:inherit;border:1.5px solid #2f5d3a;border-radius:8px;background:#fff;color:#1d3a25}
#panel input[type=range]{width:100%;margin:0}
#panel output{text-align:right}
#ver{font-weight:400;font-size:12px;opacity:.7;margin:-4px 0 8px}
#panel{max-height:70%;overflow-y:auto}
#panel details{margin:0 0 10px}
#panel summary{min-height:40px;display:flex;align-items:center;cursor:pointer}
#panel details label{display:block;margin:8px 0 4px}
#panel details input[type=text],#panel details input[type=password]{width:100%;box-sizing:border-box;min-height:40px;font:16px system-ui,sans-serif;border:1.5px solid #2f5d3a;border-radius:8px;padding:0 10px;background:#fff;color:#1d3a25}
#panel input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin:0 8px 0 0}
#panel details button{width:100%;min-height:44px;margin-top:10px;font:600 15px system-ui,sans-serif;border:1.5px solid #2f5d3a;border-radius:8px;background:#fff;color:#1d3a25}
#tpanel{position:absolute;z-index:1000;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));max-height:60%;overflow-y:auto;background:#f6f4ee;border:1.5px solid #2f5d3a;border-radius:10px;padding:10px;font:14px system-ui,sans-serif;color:#1d3a25}
#tpanel[hidden]{display:none}
#thead{display:flex;gap:8px;align-items:center}
#thead strong{flex:1;font-size:16px}
#tpanel button{min-height:40px;padding:0 12px;font:600 14px system-ui,sans-serif;border:1.5px solid #2f5d3a;border-radius:8px;background:#fff;color:#1d3a25}
#tstat{margin-top:6px;opacity:.8}
#tlist{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px}
#tlist li{background:#fff;border:1px solid #cfd6c8;border-left:6px solid transparent;border-radius:8px;padding:8px 10px}
.tn{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ts{opacity:.8;margin:2px 0 8px}
.tb{display:flex;gap:8px}
#tpanel .tb button{flex:1}
#tpied button{width:100%}
#msg{position:absolute;z-index:1001;top:calc(56px + env(safe-area-inset-top));left:8px;right:8px;background:#b3361f;color:#fff;padding:8px 12px;border-radius:8px;font:600 14px system-ui,sans-serif;display:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="info"></div>
<div id="msg" role="status"></div>
<div id="panel" hidden>
  <div class="row"><label for="f1">Couche 1 (fond)</label><select id="f1"></select>
    <input type="range" id="o1" min="0" max="100" step="5" aria-label="Opacité de la couche 1"><output id="p1"></output></div>
  <div class="row"><label for="f2">Couche 2 (par-dessus)</label><select id="f2"></select>
    <input type="range" id="o2" min="0" max="100" step="5" aria-label="Opacité de la couche 2"><output id="p2"></output></div>
  <details id="gh"><summary>Envoi des traces sur GitHub</summary>
    <label for="ghrepo">Dépôt (utilisateur/dépôt)</label><input type="text" id="ghrepo" placeholder="ton-nom/mes-traces" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="ghtok">Jeton d'accès (token)</label><input type="password" id="ghtok" placeholder="github_pat_..." autocomplete="off">
    <label for="ghdir">Dossier</label><input type="text" id="ghdir" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label><input type="checkbox" id="ghauto">Envoyer à l'arrêt de l'enregistrement</label>
    <button id="ghsend">Envoyer la trace maintenant</button>
  </details>
  <div id="ver">Version 8</div>
</div>
<div id="tpanel" hidden>
  <div id="thead"><strong>Mes traces</strong><button id="tref">Actualiser</button><button id="tclose" aria-label="Fermer">✕</button></div>
  <div id="tstat"></div>
  <ul id="tlist"></ul>
  <div id="tpied"><button id="tgpx">Télécharger la trace en cours (GPX)</button></div>
</div>
<div id="bar">
  <button id="cch">Couches</button>
  <button id="loc">Me situer</button>
  <button id="rec">Enregistrer</button>
  <button id="trc">Traces</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const ign = (layer, fmt, style = "normal") => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=${style}&FORMAT=${fmt}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
// Top 25 = Cartes IGN (SCAN 25). Données à accès restreint : l'IGN fournit une clé transitoire publique ; elle peut changer ou être retirée.
const TOP25 = "https://data.geopf.fr/private/wmts?apikey=ign_scan_ws&SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
const fonds = {
  "Plan IGN": [ign("GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2", "image/png"), { maxZoom: 19, attribution: "© IGN", crossOrigin: true }],
  "Top 25 (Cartes IGN)": [TOP25, { maxZoom: 19, maxNativeZoom: 16, attribution: "© IGN" }],
  "Photos aériennes": [ign("ORTHOIMAGERY.ORTHOPHOTOS", "image/jpeg"), { maxZoom: 19, attribution: "© IGN", crossOrigin: true }],
  "Relief (ombrage)": [ign("ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW", "image/png", "estompage_grayscale"), { maxZoom: 19, maxNativeZoom: 17, attribution: "© IGN", crossOrigin: true }],
  "OpenStreetMap": ["https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap", crossOrigin: true }]
};

const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };

const v = load("vue", { c: [46.6, 2.4], z: 6 });
const map = L.map("map", { zoomControl: false, attributionControl: false }).setView(v.c, v.z);
L.control.attribution({ position: "topright" }).addTo(map);
L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
map.on("moveend", () => save("vue", { c: map.getCenter(), z: map.getZoom() }));

// Couches : 1 = fond, 2 = superposition (chacune avec son opacité)
function msg(t, ok) { const e = $("msg"); e.style.background = ok ? "#2f5d3a" : "#b3361f"; e.textContent = t; e.style.display = "block"; clearTimeout(msg.t); msg.t = setTimeout(() => e.style.display = "none", 6000); }
map.createPane("couche2"); map.getPane("couche2").style.zIndex = 250;
const sel = load("couches", { n1: "Plan IGN", o1: 100, n2: "", o2: 60 });
if (!fonds[sel.n1]) sel.n1 = "Plan IGN";
if (sel.n2 && !fonds[sel.n2]) sel.n2 = "";
const cur = {};
function applique(i) {
  if (cur[i]) { map.removeLayer(cur[i]); cur[i] = null; }
  const nom = sel["n" + i];
  if (i === 2) map.getPane("couche2").style.mixBlendMode = nom.startsWith("Relief") ? "multiply" : "normal";
  if (!nom) return;
  const [url, o] = fonds[nom];
  const l = L.tileLayer(url, { ...o, opacity: sel["o" + i] / 100, pane: i === 2 ? "couche2" : "tilePane" });
  let err = 0;
  l.on("tileerror", () => { if (++err === 8) msg(nom + " : tuiles indisponibles (hors connexion ou accès restreint)."); });
  l.addTo(map); cur[i] = l;
}
for (const i of [1, 2]) {
  const s = $("f" + i), r = $("o" + i), p = $("p" + i);
  if (i === 2) s.add(new Option("Aucune", "", false, !sel.n2));
  Object.keys(fonds).forEach(n => s.add(new Option(n, n, false, n === sel["n" + i])));
  r.value = sel["o" + i]; p.textContent = sel["o" + i] + " %";
  s.onchange = () => { sel["n" + i] = s.value; save("couches", sel); applique(i); };
  r.oninput = () => { sel["o" + i] = +r.value; p.textContent = r.value + " %"; if (cur[i]) cur[i].setOpacity(r.value / 100); save("couches", sel); };
  applique(i);
}
$("cch").onclick = () => { $("tpanel").hidden = true; $("panel").hidden = !$("panel").hidden; };
map.on("click", () => { $("panel").hidden = true; $("tpanel").hidden = true; });

// Position et tracé
let me, acc, watching = false, rec = false, dist = 0;
let track = load("trace", []);                       // [lat, lng, alt, temps]
const line = L.polyline(track.map(p => [p[0], p[1]]), { color: "#b3361f", weight: 5 }).addTo(map);
for (let i = 1; i < track.length; i++) dist += map.distance([track[i-1][0], track[i-1][1]], [track[i][0], track[i][1]]);

function show() {
  const el = $("info");
  el.style.display = track.length ? "block" : "none";
  el.textContent = (dist / 1000).toFixed(2) + " km";
}
show();

function watch() {
  if (watching) return;
  watching = true;
  map.locate({ watch: true, enableHighAccuracy: true, setView: false });
}

map.on("locationfound", e => {
  if (!me) {
    me = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 2, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map);
    acc = L.circle(e.latlng, { radius: e.accuracy, weight: 1, interactive: false }).addTo(map);
  }
  me.setLatLng(e.latlng);
  acc.setLatLng(e.latlng).setRadius(e.accuracy);
  if (rec && e.accuracy < 50) {
    const last = track[track.length - 1];
    const d = last ? map.distance([last[0], last[1]], e.latlng) : 0;
    if (!last || d > 5) {
      dist += d;
      track.push([e.latlng.lat, e.latlng.lng, e.altitude, e.timestamp]);
      line.addLatLng(e.latlng);
      save("trace", track);
      show();
    }
  }
});
map.on("locationerror", e => { watching = false; alert("Position indisponible : " + e.message); });

$("loc").onclick = () => {
  watch();
  if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 15));
  else map.once("locationfound", e => map.setView(e.latlng, 15));
};

$("rec").onclick = () => {
  rec = !rec;
  $("rec").classList.toggle("on", rec);
  $("rec").textContent = rec ? "Arrêter" : "Enregistrer";
  if (rec) {
    if (track.length && !confirm("Effacer le tracé précédent et recommencer ?")) { rec = false; $("rec").classList.remove("on"); $("rec").textContent = "Enregistrer"; return; }
    track = []; dist = 0; line.setLatLngs([]); save("trace", track); show();
    watch();
  } else if (gh.auto) envoyer();
};

function gpxXml() {
  const pts = track.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[2] != null ? `<ele>${p[2]}</ele>` : ""}<time>${new Date(p[3]).toISOString()}</time></trkpt>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Carto" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Randonnée du ${new Date(track[0][3]).toLocaleDateString("fr-FR")}</name><trkseg>${pts}</trkseg></trk></gpx>`;
}
$("tgpx").onclick = () => {
  if (!track.length) return alert("Aucun tracé enregistré.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([gpxXml()], { type: "application/gpx+xml" }));
  a.download = "randonnee.gpx";
  a.click();
};

// Envoi de la trace dans un dépôt GitHub (API REST, jeton stocké uniquement dans ce navigateur)
const gh = load("github", { repo: "", tok: "", dir: "traces", auto: false });
$("ghrepo").value = gh.repo; $("ghtok").value = gh.tok; $("ghdir").value = gh.dir; $("ghauto").checked = gh.auto;
[["ghrepo", "repo"], ["ghtok", "tok"], ["ghdir", "dir"]].forEach(([id, k]) => $(id).oninput = e => { gh[k] = e.target.value.trim(); save("github", gh); });
$("ghauto").onchange = e => { gh.auto = e.target.checked; save("github", gh); };
async function envoyer() {
  if (track.length < 2) return msg("Aucune trace à envoyer.");
  if (!/^[\w.-]+\/[\w.-]+$/.test(gh.repo) || !gh.tok) return msg("Renseigne le dépôt et le jeton dans Couches → Envoi des traces.");
  const d = new Date(track[0][3]), z = n => String(n).padStart(2, "0");
  const nom = `trace-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.gpx`;
  const dir = (gh.dir || "traces").replace(/^\/+|\/+$/g, "");
  try {
    const r = await fetch(`https://api.github.com/repos/${gh.repo}/contents/${dir}/${nom}`, {
      method: "PUT",
      headers: { Authorization: "Bearer " + gh.tok, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
      body: JSON.stringify({ message: "Trace " + nom, content: btoa(unescape(encodeURIComponent(gpxXml()))) })
    });
    if (r.status === 201) { msg("Trace envoyée : " + dir + "/" + nom, true); if (!$("tpanel").hidden) chargerTraces(); }
    else { const j = await r.json().catch(() => ({})); msg("Échec (" + r.status + ") : " + (j.message || "erreur")); }
  } catch (e) { msg("Échec de l'envoi : réseau indisponible. Réessaie plus tard avec « Envoyer la trace maintenant »."); }
}
$("ghsend").onclick = envoyer;

// Gestion des traces du dépôt : liste, affichage sur la carte, renommage
const tmeta = load("tmeta", {});   // sha -> { n: nom, d: date ISO, k: distance en m }
const tmem = {};                   // sha -> points [[lat, lng], ...]
const tshow = {};                  // sha -> tracé affiché sur la carte
const COULEURS = ["#e8590c", "#1971c2", "#9c36b5", "#2b8a3e", "#c2255c", "#f08c00"];
let tlist = [];
const depotOk = () => /^[\w.-]+\/[\w.-]+$/.test(gh.repo) && gh.tok;
const dossier = () => (gh.dir || "traces").replace(/^\/+|\/+$/g, "");
const api = (chemin, o = {}) => fetch("https://api.github.com/repos/" + gh.repo + "/contents/" + chemin,
  { ...o, headers: { Authorization: "Bearer " + gh.tok, "X-GitHub-Api-Version": "2022-11-28", ...(o.headers || {}) } });
const dateDuNom = n => { const m = n.match(/(\d{4})-(\d\d)-(\d\d)-(\d\d)(\d\d)(\d\d)/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).toISOString() : ""; };
const fmtDate = d => d ? new Date(d).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" }) : "date inconnue";
const fmtKm = k => (k / 1000).toFixed(2).replace(".", ",") + " km";

function lisGpx(txt) {
  const x = new DOMParser().parseFromString(txt, "application/xml");
  const pts = [...x.getElementsByTagName("trkpt")].map(e => [+e.getAttribute("lat"), +e.getAttribute("lon")]);
  const t = x.getElementsByTagName("time")[0], nm = x.querySelector("trk > name");
  let k = 0;
  for (let i = 1; i < pts.length; i++) k += map.distance(pts[i - 1], pts[i]);
  return { pts, n: nm ? nm.textContent : "", d: t ? t.textContent : "", k };
}
async function lire(f) {
  const r = await api(f.path, { headers: { Accept: "application/vnd.github.raw+json" } });
  if (!r.ok) throw new Error(r.status);
  const g = lisGpx(await r.text());
  tmem[f.sha] = g.pts;
  return { n: g.n, d: g.d || dateDuNom(f.name), k: g.k };
}

async function chargerTraces() {
  const st = $("tstat");
  if (!depotOk()) { st.textContent = "Renseigne d'abord le dépôt et le jeton (Couches → Envoi des traces)."; return; }
  st.textContent = "Chargement…";
  try {
    const r = await api(dossier());
    if (r.status === 404) { tlist = []; dessineListe(); st.textContent = "Aucune trace trouvée dans « " + dossier() + " » (dossier inexistant, ou dépôt/jeton incorrect)."; return; }
    if (!r.ok) { st.textContent = "Erreur " + r.status + " en lisant le dépôt."; return; }
    const fichiers = (await r.json()).filter(f => f.type === "file" && /\.gpx$/i.test(f.name));
    const nv = {};
    for (const f of fichiers) {
      if (tmeta[f.sha]) { nv[f.sha] = tmeta[f.sha]; continue; }
      st.textContent = "Lecture de " + f.name + "…";
      nv[f.sha] = await lire(f);
    }
    Object.keys(tmeta).forEach(k => delete tmeta[k]);
    Object.assign(tmeta, nv); save("tmeta", tmeta);
    tlist = fichiers.map(f => ({ f, m: tmeta[f.sha] })).sort((a, b) => (b.m.d || "").localeCompare(a.m.d || ""));
    st.textContent = tlist.length ? tlist.length + (tlist.length > 1 ? " traces" : " trace") : "Aucune trace pour l'instant.";
    dessineListe();
  } catch (e) { st.textContent = "Impossible de charger les traces (hors connexion ?)."; }
}

function bouton(txt, fn) { const b = document.createElement("button"); b.textContent = txt; b.onclick = fn; return b; }
function dessineListe() {
  const ul = $("tlist"); ul.textContent = "";
  tlist.forEach(({ f, m }) => {
    const li = document.createElement("li"), n = document.createElement("div"), s = document.createElement("div"), b = document.createElement("div");
    n.className = "tn"; n.textContent = m.n || f.name;
    s.className = "ts"; s.textContent = fmtDate(m.d) + " · " + fmtKm(m.k);
    b.className = "tb";
    b.append(bouton(tshow[f.sha] ? "Masquer" : "Afficher", () => basculer(f)), bouton("Renommer", () => renommer(f, m)));
    if (tshow[f.sha]) li.style.borderLeftColor = tshow[f.sha].options.color;
    li.append(n, s, b); ul.append(li);
  });
}

async function basculer(f) {
  const ex = tshow[f.sha];
  if (ex) { map.removeLayer(ex); delete tshow[f.sha]; dessineListe(); return; }
  try {
    if (!tmem[f.sha]) await lire(f);
    const m = tmeta[f.sha] || {};
    const l = L.polyline(tmem[f.sha], { color: COULEURS[Object.keys(tshow).length % COULEURS.length], weight: 5, opacity: 0.9 }).addTo(map);
    l.bindTooltip(m.n || f.name, { sticky: true });
    tshow[f.sha] = l; dessineListe();
    map.fitBounds(l.getBounds(), { paddingTopLeft: [20, 60], paddingBottomRight: [20, $("tpanel").offsetHeight + 80] });
  } catch (e) { msg("Impossible de charger la trace."); }
}

async function renommer(f, m) {
  const saisie = prompt("Nouveau nom de la trace :", m.n || "");
  if (saisie === null || !saisie.trim() || saisie.trim() === m.n) return;
  const nom = saisie.trim();
  try {
    const r = await api(f.path, { headers: { Accept: "application/vnd.github.raw+json" } });
    if (!r.ok) throw new Error(r.status);
    let txt = await r.text();
    const esc = nom.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const re = /(<trk[^>]*>\s*<name>)[\s\S]*?(<\/name>)/;
    txt = re.test(txt) ? txt.replace(re, (_, a, b) => a + esc + b) : txt.replace(/<trk([^>]*)>/, (_, a) => "<trk" + a + "><name>" + esc + "</name>");
    const w = await api(f.path, { method: "PUT", headers: { Accept: "application/vnd.github+json" },
      body: JSON.stringify({ message: "Renommer : " + nom, content: btoa(unescape(encodeURIComponent(txt))), sha: f.sha }) });
    if (!w.ok) throw new Error(w.status);
    const ns = (await w.json()).content.sha;
    if (tshow[f.sha]) { tshow[ns] = tshow[f.sha]; delete tshow[f.sha]; tshow[ns].setTooltipContent(nom); }
    if (tmem[f.sha]) { tmem[ns] = tmem[f.sha]; delete tmem[f.sha]; }
    tmeta[ns] = { ...m, n: nom }; delete tmeta[f.sha]; save("tmeta", tmeta);
    msg("Trace renommée.", true);
    chargerTraces();
  } catch (e) { msg("Échec du renommage (" + e.message + ")."); }
}

$("trc").onclick = () => { $("panel").hidden = true; const ferme = !$("tpanel").hidden; $("tpanel").hidden = ferme; if (!ferme) chargerTraces(); };
$("tref").onclick = chargerTraces;
